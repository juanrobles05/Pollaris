name: Backend CI

on:
    pull_request:
        branches:
            - develop

        paths:
            - 'backend/**'
            - '.github/workflows/**'

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install deps
        run: uv sync --frozen --dev

      - name: Run linter and formatter
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run tests
        run: uv run pytest -v
